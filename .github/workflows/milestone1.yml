name: Milestone 1

# Runs the real Milestone 1 evaluation (tools/run_milestone1.py via `make
# milestone1`): both default models over the 30-task generated set, $20 cost
# cap, resumable. Manual trigger only -- this makes real, billed Anthropic
# API calls, so it must not fire on every push.
#
# Setup: add a repository secret named ANTHROPIC_API_KEY (Settings ->
# Secrets and variables -> Actions -> New repository secret) before running.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model list (default: both Milestone 1 models)"
        required: false
        default: ""
      max_cost_usd:
        description: "Cost cap in USD"
        required: false
        default: "20"
      score_only:
        description: "Re-score existing episodes with no new model calls"
        type: boolean
        required: false
        default: false

jobs:
  milestone1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check ANTHROPIC_API_KEY is configured
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY repo secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Milestone 1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          if [ -n "${{ inputs.models }}" ]; then
            args+=(--models "${{ inputs.models }}")
          fi
          args+=(--max-cost-usd "${{ inputs.max_cost_usd }}")
          if [ "${{ inputs.score_only }}" = "true" ]; then
            args+=(--score-only)
          fi
          python tools/run_milestone1.py "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-results
          path: build/milestone1/
          if-no-files-found: warn
